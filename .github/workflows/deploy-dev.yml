name: Deploy Dev

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  resolve-delay:
    runs-on: ubuntu-latest
    outputs:
      delay_minutes: ${{ steps.delay.outputs.minutes }}
      delay_seconds: ${{ steps.delay.outputs.seconds }}
    steps:
      - name: Determine deploy delay from PR label
        id: delay
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABEL=$(gh pr list \
            --repo "${{ github.repository }}" \
            --search "${{ github.sha }}" \
            --state merged \
            --json labels \
            --jq '[.[0].labels[].name // empty | select(startswith("deploy:"))] | .[0] // empty' \
            2>/dev/null || true)

          case "$LABEL" in
            deploy:long)
              echo "minutes=60" >> $GITHUB_OUTPUT
              echo "seconds=3600" >> $GITHUB_OUTPUT
              echo "Deploy delay: long (60 min)"
              ;;
            deploy:default)
              echo "minutes=15" >> $GITHUB_OUTPUT
              echo "seconds=900" >> $GITHUB_OUTPUT
              echo "Deploy delay: default (15 min)"
              ;;
            *)
              echo "minutes=0" >> $GITHUB_OUTPUT
              echo "seconds=0" >> $GITHUB_OUTPUT
              echo "Deploy delay: quick (0 min)"
              ;;
          esac

  deploy:
    runs-on: ubuntu-latest
    needs: resolve-delay
    env:
      APP_BASE_URL: https://magic-the-battling-dev.fly.dev
      OPS_UPDATED_BY: github-actions-dev
      DELAY_MINUTES: ${{ needs.resolve-delay.outputs.delay_minutes }}
      DELAY_SECONDS: ${{ needs.resolve-delay.outputs.delay_seconds }}
    steps:
      - uses: actions/checkout@v4

      # Draining starts in this job so that the always() step below ends it however the run ends.
      - name: Enter draining mode
        if: env.DELAY_MINUTES != '0'
        run: |
          SWITCH_AT_UTC=$(date -u -d "+${DELAY_MINUTES} minutes" "+%Y-%m-%d %H:%M UTC")
          sh scripts/ops_mode.sh draining "Server update scheduled for ${SWITCH_AT_UTC}. New games are temporarily paused. Tip: if you are currently in a game, you can reconnect and continue after the update."
        env:
          OPS_API_TOKEN: ${{ secrets.OPS_API_TOKEN_DEV }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Wait for scheduled deploy window
        if: env.DELAY_SECONDS != '0'
        run: sleep "${DELAY_SECONDS}"

      - name: Deploy app
        id: deploy_app
        run: flyctl deploy --config fly.dev.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_DEV }}

      - name: Return to normal mode
        # A failed or cancelled deploy leaves the old machine serving, so it must not stay draining.
        if: always()
        timeout-minutes: 2
        run: sh scripts/ops_mode.sh normal
        env:
          OPS_API_TOKEN: ${{ secrets.OPS_API_TOKEN_DEV }}
