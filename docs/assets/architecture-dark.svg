<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-label="Pitfight architecture: React and Vite web client communicating over HTTP and WebSocket with the FastAPI server, which runs game actions through the pure Python rules engine in pitfight/, stores snapshots in SQLite, and loads cube and card data from CubeCobra and Scryfall.">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .group { fill: #152042; stroke: #6e8cf0; stroke-width: 1.5; }
      .box { fill: #0d1117; stroke: #3d444d; stroke-width: 1.25; }
      .title { fill: #e6edf3; font-size: 15px; font-weight: 600; }
      .box-title { fill: #e6edf3; font-size: 14px; font-weight: 600; }
      .item { fill: #e6edf3; font-size: 13px; font-weight: 500; }
      .muted { fill: #9198a1; font-size: 13px; font-weight: 400; }
      .edge { stroke: #9198a1; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #9198a1; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" class="arrow-head"/>
    </marker>
  </defs>

  <!-- Web client -->
  <rect x="16" y="20" width="202" height="230" rx="10" class="group"/>
  <text x="117" y="45" text-anchor="middle" class="font title">Web client</text>
  <text x="117" y="65" text-anchor="middle" class="font muted">web/src/ · React + Vite</text>
  <rect x="28" y="82" width="178" height="44" rx="6" class="box"/>
  <text x="117" y="109" text-anchor="middle" class="font item">Phase views &amp; pages</text>
  <rect x="28" y="136" width="178" height="44" rx="6" class="box"/>
  <text x="117" y="163" text-anchor="middle" class="font item">Hooks &amp; state machines</text>
  <rect x="28" y="190" width="178" height="44" rx="6" class="box"/>
  <text x="117" y="217" text-anchor="middle" class="font item">Unified layout engine</text>

  <!-- FastAPI server -->
  <rect x="309" y="20" width="202" height="230" rx="10" class="group"/>
  <text x="410" y="45" text-anchor="middle" class="font title">FastAPI server</text>
  <text x="410" y="65" text-anchor="middle" class="font muted">server/ · HTTP + WS</text>
  <rect x="321" y="82" width="178" height="44" rx="6" class="box"/>
  <text x="410" y="109" text-anchor="middle" class="font item">Routers &amp; WS dispatch</text>
  <rect x="321" y="136" width="178" height="44" rx="6" class="box"/>
  <text x="410" y="163" text-anchor="middle" class="font item">GameManager services</text>
  <rect x="321" y="190" width="178" height="44" rx="6" class="box"/>
  <text x="410" y="217" text-anchor="middle" class="font item">ConnectionManager</text>

  <!-- Rules engine -->
  <rect x="602" y="20" width="202" height="230" rx="10" class="group"/>
  <text x="703" y="45" text-anchor="middle" class="font title">Rules engine</text>
  <text x="703" y="65" text-anchor="middle" class="font muted">pitfight/ · Pure Python</text>
  <rect x="614" y="82" width="178" height="44" rx="6" class="box"/>
  <text x="703" y="109" text-anchor="middle" class="font item">Game &amp; card models</text>
  <rect x="614" y="136" width="178" height="44" rx="6" class="box"/>
  <text x="703" y="163" text-anchor="middle" class="font item">Phase rules &amp; pairing</text>
  <rect x="614" y="190" width="178" height="44" rx="6" class="box"/>
  <text x="703" y="217" text-anchor="middle" class="font item">Zero server imports</text>

  <!-- Bottom row: persistence and external feeds -->
  <rect x="16" y="316" width="202" height="68" rx="8" class="box"/>
  <text x="117" y="344" text-anchor="middle" class="font box-title">Browser storage</text>
  <text x="117" y="366" text-anchor="middle" class="font muted">Sessions &amp; saved layouts</text>

  <rect x="309" y="316" width="202" height="68" rx="8" class="box"/>
  <text x="410" y="344" text-anchor="middle" class="font box-title">SQLite database</text>
  <text x="410" y="366" text-anchor="middle" class="font muted">Snapshots &amp; game records</text>

  <rect x="602" y="316" width="202" height="68" rx="8" class="box"/>
  <text x="703" y="344" text-anchor="middle" class="font box-title">CubeCobra &amp; Scryfall</text>
  <text x="703" y="366" text-anchor="middle" class="font muted">Cube lists &amp; card data</text>

  <!-- Horizontal edges: Web client <-> FastAPI server -->
  <line x1="226" y1="118" x2="301" y2="118" class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="263.5" y="108" text-anchor="middle" class="font muted">HTTP</text>

  <line x1="226" y1="158" x2="301" y2="158" class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="263.5" y="178" text-anchor="middle" class="font muted">WebSocket</text>

  <!-- Horizontal edges: FastAPI server <-> Rules engine -->
  <line x1="518" y1="118" x2="594" y2="118" class="edge" marker-end="url(#arrow)"/>
  <text x="556.5" y="108" text-anchor="middle" class="font muted">Actions</text>

  <line x1="595" y1="158" x2="519" y2="158" class="edge" marker-end="url(#arrow)"/>
  <text x="556.5" y="178" text-anchor="middle" class="font muted">Read views</text>

  <!-- Vertical edges -->
  <line x1="117" y1="258" x2="117" y2="308" class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="128" y="288" text-anchor="start" class="font muted">Local state</text>

  <line x1="410" y1="258" x2="410" y2="308" class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="421" y="288" text-anchor="start" class="font muted">Snapshots</text>

  <line x1="703" y1="309" x2="703" y2="258" class="edge" marker-end="url(#arrow)"/>
  <text x="714" y="288" text-anchor="start" class="font muted">Card feeds</text>
</svg>
