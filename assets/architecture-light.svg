<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 374" role="img" aria-label="Crucible architecture. The React and TypeScript web client connects over REST APIs to FastAPI HTTP and Ops routers and over gzip-compressed WebSockets to the Real-Time Game Hub. The Game Hub drives the pure-Python Crucible Rules Engine (Draft, Build, Battle, Reward, Elimination, pairings, sudden death, ghosts, and historical puppets) and persists snapshots alongside the HTTP layer to SQLite WAL storage and external CubeCobra and Scryfall card APIs.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328;text-anchor:middle;font-size:15.5px}
.t{font-weight:600}.s{font-size:13px;fill:#59636e}
.line{fill:none;stroke:#1f2328;stroke-width:1.5}.head{fill:#1f2328}
.bline{fill:none;stroke:#3a5bd9;stroke-width:1.5}.bhead{fill:#3a5bd9}
.box{fill:#ffffff;stroke:#b8bec6}.round{fill:#eef2fd;stroke:#3a5bd9}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="bhead"/></marker>
</defs>
<rect class="round" x="24" y="20" width="772" height="64" rx="10"/>
<text x="410" y="47" class="t">Crucible Web Client (web/)</text>
<text x="410" y="68" class="s">React 19 + TypeScript + Vite · lobbies, drag-and-drop zones, live battles &amp; share views</text>
<path class="line" d="M208 88 V118" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="150" y="107" class="s">REST API</text>
<path class="bline" d="M612 88 V118" marker-start="url(#b)" marker-end="url(#b)"/>
<text x="688" y="107" class="s">WebSocket (gzip)</text>
<rect class="box" x="24" y="122" width="368" height="86" rx="10"/>
<text x="208" y="152" class="t">FastAPI HTTP &amp; Ops (server/routers/)</text>
<text x="208" y="174" class="s">auth, lobbies, cubes/decks, discover &amp; ops mode</text>
<text x="208" y="193" class="s">Playwright share-card PNG previews</text>
<rect class="box" x="428" y="122" width="368" height="86" rx="10"/>
<text x="612" y="152" class="t">Real-Time Game Hub (server/services/)</text>
<text x="612" y="174" class="s">GameManager &amp; phase-gated WebSocket hub</text>
<text x="612" y="193" class="s">hot/cold eviction · periodic game snapshots</text>
<path class="line" d="M396 165 H424" marker-start="url(#a)" marker-end="url(#a)"/>
<rect class="box" x="24" y="268" width="332" height="86" rx="10"/>
<text x="190" y="298" class="t">Storage &amp; Card Data</text>
<text x="190" y="320" class="s">SQLite WAL (/data/mtb.db)</text>
<text x="190" y="339" class="s">CubeCobra &amp; Scryfall APIs</text>
<rect class="round" x="392" y="268" width="404" height="86" rx="10"/>
<text x="594" y="298" class="t">Crucible Rules Engine (mtb/)</text>
<text x="594" y="320" class="s">Draft → Build → Battle → Reward → Elimination</text>
<text x="594" y="339" class="s">pairings, sudden death, ghosts &amp; historical puppets</text>
<path class="line" d="M190 212 V264" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="114" y="242" class="s">users &amp; history</text>
<path class="line" d="M468 208 V238 H286 V264" marker-end="url(#a)"/>
<text x="378" y="229" class="s">snapshots &amp; cards</text>
<path class="bline" d="M612 212 V264" marker-start="url(#b)" marker-end="url(#b)"/>
<text x="702" y="242" class="s">actions &amp; state</text>
</svg>
